name: FAYE-0007 QUIET_INIT Screen

on:
  push:
    branches: [main]
    paths:
      - ".github/faye-0007-trigger"

permissions:
  contents: read

concurrency:
  group: faye-0007-screen
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      FASTCHESS_SHA: 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
      BUILD_ARCH: x86-64-avx2
      TC: 10+0.1
      HASH_MB: '16'
      THREADS: '1'
      CONCURRENCY: '2'

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make git curl unzip

      - name: Create isolated candidate and parent
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          mkdir -p results
          git worktree add --detach candidate "$SHA"
          git worktree add --detach parent "$SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('candidate/src/movepick.cpp')
          s = p.read_text()
          enum_old = '''    GOOD_CAPTURE,\n    QUIET_INIT,\n    GOOD_QUIET,'''
          enum_new = '''    GOOD_CAPTURE,\n    GOOD_QUIET,'''
          flow_old = '''        ++stage;\n        [[fallthrough]];\n\n    case QUIET_INIT :\n        if (!skipQuiets)'''
          flow_new = '''        if (!skipQuiets)'''
          if s.count(enum_old) != 1:
              raise SystemExit(f'QUIET_INIT enum pattern count={s.count(enum_old)}; expected 1')
          if s.count(flow_old) != 1:
              raise SystemExit(f'QUIET_INIT flow pattern count={s.count(flow_old)}; expected 1')
          s = s.replace(enum_old, enum_new).replace(flow_old, flow_new)
          if 'QUIET_INIT' in s:
              raise SystemExit('QUIET_INIT still present after patch')
          p.write_text(s)
          PY
          git -C candidate diff --check
          git -C candidate diff -- src/movepick.cpp > results/faye-0007.patch
          test -s results/faye-0007.patch
          ! grep -q 'QUIET_INIT' candidate/src/movepick.cpp
          echo "$SHA" > results/parent-sha.txt
          printf '%s\n' 940c39c2df1df289b8249d2eb88b1cb7b1cabccb > results/upstream-pr-head.txt
          printf '%s\n' 59aae690f91d6f69aac194f447d84b4a2c3be778 > results/upstream-pr-base.txt

      - name: Build candidate and parent
        run: |
          set -euo pipefail
          mkdir -p build results
          make -C candidate/src -j2 profile-build ARCH="$BUILD_ARCH"
          cp candidate/src/stockfish build/candidate
          make -C parent/src -j2 profile-build ARCH="$BUILD_ARCH"
          cp parent/src/stockfish build/parent
          chmod +x build/candidate build/parent

      - name: Verify functional bench and measure NPS
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            ./build/parent bench 16 1 8 default depth > "results/parent-bench-${i}.txt" 2>&1
            ./build/candidate bench 16 1 8 default depth > "results/candidate-bench-${i}.txt" 2>&1
          done
          python3 - <<'PY'
          import json, pathlib, re, statistics
          def read(prefix):
              vals=[]; nodes=[]
              for p in sorted(pathlib.Path('results').glob(prefix+'-bench-*.txt')):
                  txt=p.read_text(errors='replace')
                  m=re.search(r'Nodes/second\s*:\s*(\d+)',txt)
                  n=re.search(r'Nodes searched\s*:\s*(\d+)',txt)
                  if not m or not n: raise SystemExit(f'Cannot parse {p}')
                  vals.append(int(m.group(1))); nodes.append(int(n.group(1)))
              return vals,nodes
          cand,cn=read('candidate'); parent,pn=read('parent')
          if len(set(cn+pn)) != 1: raise SystemExit('Functional bench mismatch for no-functional-change candidate')
          cm=statistics.median(cand); pm=statistics.median(parent); speed=(cm/pm-1)*100
          out={'candidate_nps':cand,'parent_nps':parent,'candidate_median_nps':cm,'parent_median_nps':pm,'median_speedup_percent':speed,'bench_nodes':cn[0]}
          pathlib.Path('results/efficiency.json').write_text(json.dumps(out,indent=2)+'\n')
          pathlib.Path('results/efficiency.md').write_text(f'### FAYE-0007 bench efficiency\n\n- Candidate median NPS: {cm:,.0f}\n- Parent median NPS: {pm:,.0f}\n- Median speedup: {speed:+.3f}%\n- Bench nodes: {cn[0]:,}\n')
          PY
          cat results/efficiency.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone https://github.com/Disservin/fastchess.git fastchess-src
          git -C fastchess-src checkout "$FASTCHESS_SHA"
          make -C fastchess-src -j2 GIT_SHA="${FASTCHESS_SHA:0:8}" GIT_DATE=01010101
          mkdir -p tools
          cp fastchess-src/fastchess tools/fastchess
          chmod +x tools/fastchess

      - name: Download Fishtest opening set
        id: book
        run: |
          set -euo pipefail
          mkdir -p books
          curl -L --fail --retry 3 https://raw.githubusercontent.com/official-stockfish/books/master/UHO_Lichess_4852_v1.epd.zip -o books/UHO_Lichess_4852_v1.epd.zip
          unzip -o -j books/UHO_Lichess_4852_v1.epd.zip -d books
          echo "file=books/UHO_Lichess_4852_v1.epd" >> "$GITHUB_OUTPUT"

      - name: Run paired screen
        env:
          ENGINE_A: ./build/candidate
          ENGINE_B: ./build/parent
          ENGINE_A_NAME: FAYE-0007
          ENGINE_B_NAME: FayE-parent
          ENGINE_A_OPTIONS: ''
          ENGINE_B_OPTIONS: ''
          FASTCHESS: ./tools/fastchess
          BOOK_FILE: ${{ steps.book.outputs.file }}
          VARIANT: standard
          TC: ${{ env.TC }}
          ROUNDS: '200'
          CONCURRENCY: ${{ env.CONCURRENCY }}
          THREADS: ${{ env.THREADS }}
          HASH_MB: ${{ env.HASH_MB }}
          MODE: fixed
          OUTPUT_DIR: results
          SPRT_ELO0: '0'
          SPRT_ELO1: '2'
          SEED: ${{ github.run_id }}
        run: |
          chmod +x scripts/run_ab_match.sh
          scripts/run_ab_match.sh

      - name: Summarize
        if: always()
        run: |
          if [[ -s results/ab-match.pgn ]]; then
            python3 scripts/summarize_ab.py results/ab-match.pgn --json-out results/summary.json --markdown-out results/summary.md
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY'
          import json, pathlib
          meta={"experiment_id":"FAYE-0007","source":"official-stockfish/Stockfish#7150","upstream_head":"940c39c2df1df289b8249d2eb88b1cb7b1cabccb","upstream_base":"59aae690f91d6f69aac194f447d84b4a2c3be778","games":400,"tc":"10+0.1","threads":1,"hash_mb":16,"book":"UHO_Lichess_4852_v1.epd","paired":True,"mode":"fixed","functional_change":False}
          pathlib.Path('results/experiment-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAYE-0007-screen-${{ github.run_id }}
          path: results/
          retention-days: 30
