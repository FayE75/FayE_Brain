name: FAYE-0005 TT Miss Guard Confirmation

on:
  push:
    branches: [main]
    paths:
      - ".github/faye-0005-confirm-trigger"

permissions:
  contents: read

concurrency:
  group: faye-0005-confirmation
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      FASTCHESS_SHA: 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
      BUILD_ARCH: x86-64-avx2
      TC: 10+0.1
      HASH_MB: '16'
      THREADS: '1'
      CONCURRENCY: '2'

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make git curl unzip

      - name: Create isolated candidate and parent
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          mkdir -p results
          git worktree add --detach candidate "$SHA"
          git worktree add --detach parent "$SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/src/search.cpp')
          s=p.read_text()
          old1='ttData.move  = rootNode ? rootMoves[pvIdx].pv[0] : ttHit ? ttData.move : Move::none();\n    ttData.value = ttHit ? value_from_tt(ttData.value, ss->ply, pos.rule50_count()) : VALUE_NONE;'
          new1='ttData.move  = rootNode ? rootMoves[pvIdx].pv[0] : ttData.move;\n    ttData.value = value_from_tt(ttData.value, ss->ply, pos.rule50_count());'
          old2='ttData.move  = ttHit ? ttData.move : Move::none();\n    ttData.value = ttHit ? value_from_tt(ttData.value, ss->ply, pos.rule50_count()) : VALUE_NONE;'
          new2='ttData.value = value_from_tt(ttData.value, ss->ply, pos.rule50_count());'
          if s.count(old1) != 1: raise SystemExit('main-search TT guard pattern not unique')
          if s.count(old2) != 1: raise SystemExit('qsearch TT guard pattern not unique')
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s)
          PY
          git -C candidate diff --check
          git -C candidate diff -- src/search.cpp > results/faye-0005.patch
          test -s results/faye-0005.patch
          grep -q 'ttData.value = value_from_tt' candidate/src/search.cpp
          grep -q 'return {false, TTData{Move::none(), VALUE_NONE, VALUE_NONE' candidate/src/tt.cpp
          echo "$SHA" > results/parent-sha.txt
          printf '%s\n' 995fd5480e6bc852846f3f1cf878e5b3d60c04e4 > results/upstream-pr-head.txt
          printf '%s\n' 133731f33166afcde7fb7a76c41e47c3cddcee8b > results/upstream-pr-base.txt

      - name: Build candidate and parent
        run: |
          set -euo pipefail
          mkdir -p build results
          make -C candidate/src -j2 profile-build ARCH="$BUILD_ARCH"
          cp candidate/src/stockfish build/candidate
          make -C parent/src -j2 profile-build ARCH="$BUILD_ARCH"
          cp parent/src/stockfish build/parent
          chmod +x build/candidate build/parent

      - name: Verify functional bench and remeasure NPS
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            ./build/parent bench 16 1 8 default depth > "results/parent-bench-${i}.txt" 2>&1
            ./build/candidate bench 16 1 8 default depth > "results/candidate-bench-${i}.txt" 2>&1
          done
          python3 - <<'PY'
          import json, pathlib, re, statistics
          def read(prefix):
              vals=[]; nodes=[]
              for p in sorted(pathlib.Path('results').glob(prefix+'-bench-*.txt')):
                  txt=p.read_text(errors='replace')
                  m=re.search(r'Nodes/second\s*:\s*(\d+)',txt)
                  n=re.search(r'Nodes searched\s*:\s*(\d+)',txt)
                  if not m or not n: raise SystemExit(f'Cannot parse {p}')
                  vals.append(int(m.group(1))); nodes.append(int(n.group(1)))
              return vals,nodes
          cand,cn=read('candidate'); parent,pn=read('parent')
          if len(set(cn+pn)) != 1: raise SystemExit('Functional bench mismatch')
          cm=statistics.median(cand); pm=statistics.median(parent); speed=(cm/pm-1)*100
          out={'candidate_nps':cand,'parent_nps':parent,'candidate_median_nps':cm,'parent_median_nps':pm,'median_speedup_percent':speed,'bench_nodes':cn[0]}
          pathlib.Path('results/efficiency.json').write_text(json.dumps(out,indent=2)+'\n')
          pathlib.Path('results/efficiency.md').write_text(f'### FAYE-0005 confirmation bench efficiency\n\n- Candidate median NPS: {cm:,.0f}\n- Parent median NPS: {pm:,.0f}\n- Median speedup: {speed:+.3f}%\n- Bench nodes: {cn[0]:,}\n')
          PY
          cat results/efficiency.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build pinned Fastchess
        run: |
          set -euo pipefail
          git clone https://github.com/Disservin/fastchess.git fastchess-src
          git -C fastchess-src checkout "$FASTCHESS_SHA"
          make -C fastchess-src -j2 GIT_SHA="${FASTCHESS_SHA:0:8}" GIT_DATE=01010101
          mkdir -p tools
          cp fastchess-src/fastchess tools/fastchess
          chmod +x tools/fastchess

      - name: Download Fishtest opening set
        id: book
        run: |
          set -euo pipefail
          mkdir -p books
          curl -L --fail --retry 3 https://raw.githubusercontent.com/official-stockfish/books/master/UHO_Lichess_4852_v1.epd.zip -o books/UHO_Lichess_4852_v1.epd.zip
          unzip -o -j books/UHO_Lichess_4852_v1.epd.zip -d books
          echo "file=books/UHO_Lichess_4852_v1.epd" >> "$GITHUB_OUTPUT"

      - name: Run paired normalized SPRT confirmation
        env:
          ENGINE_A: ./build/candidate
          ENGINE_B: ./build/parent
          ENGINE_A_NAME: FAYE-0005
          ENGINE_B_NAME: FayE-parent
          ENGINE_A_OPTIONS: ''
          ENGINE_B_OPTIONS: ''
          FASTCHESS: ./tools/fastchess
          BOOK_FILE: ${{ steps.book.outputs.file }}
          VARIANT: standard
          TC: ${{ env.TC }}
          ROUNDS: '600'
          CONCURRENCY: ${{ env.CONCURRENCY }}
          THREADS: ${{ env.THREADS }}
          HASH_MB: ${{ env.HASH_MB }}
          MODE: sprt
          OUTPUT_DIR: results
          SPRT_ELO0: '0'
          SPRT_ELO1: '2'
          SEED: ${{ github.run_id }}
        run: |
          chmod +x scripts/run_ab_match.sh
          scripts/run_ab_match.sh

      - name: Summarize
        if: always()
        run: |
          if [[ -s results/ab-match.pgn ]]; then
            python3 scripts/summarize_ab.py results/ab-match.pgn --json-out results/summary.json --markdown-out results/summary.md
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY'
          import json, pathlib
          meta={"experiment_id":"FAYE-0005","stage":"confirmation","source":"official-stockfish/Stockfish#6835","upstream_head":"995fd5480e6bc852846f3f1cf878e5b3d60c04e4","upstream_base":"133731f33166afcde7fb7a76c41e47c3cddcee8b","max_games":1200,"tc":"10+0.1","threads":1,"hash_mb":16,"book":"UHO_Lichess_4852_v1.epd","paired":True,"mode":"normalized SPRT","elo0":0,"elo1":2,"alpha":0.05,"beta":0.05}
          pathlib.Path('results/experiment-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAYE-0005-confirmation-${{ github.run_id }}
          path: results/
          retention-days: 30
